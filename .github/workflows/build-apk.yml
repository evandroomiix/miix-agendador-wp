name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK (Release)
        run: gradle assembleRelease --no-daemon

      - name: Renomear APK
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/release/app-release.apk output_apk/MiixAgendadorWP.apk
          echo "APK gerado com sucesso em output_apk/MiixAgendadorWP.apk"

      - name: Upload do APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: MiixAgendadorWP-APK
          path: output_apk/MiixAgendadorWP.apk
          retention-days: 30

      - name: Criar Release no GitHub (Opcional se tag ou manual)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Miix Agendador WP v1.0.0"
          tag_name: ${{ github.ref_name }}
          files: output_apk/MiixAgendadorWP.apk
          body: |
            ## 🚀 Miix Agendador WP - v1.0.0 (Modo PRO)
            
            Aplicativo de agendamento automático de mensagens para **WhatsApp** e **WhatsApp Business**.
            
            ### ✨ Recursos:
            - Disparos automáticos no WhatsApp e WhatsApp Business via Serviço de Acessibilidade.
            - Suporte a múltiplos contatos e importação em lote (CSV/Lista).
            - Intervalo de segurança anti-ban configurável.
            - Variáveis dinâmicas na mensagem (`{nome}`, `{telefone}`).
            - Repetição diária, semanal e em dias úteis.
            - 100% gratuito, sem anúncios e sem limites de envio.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
