name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Gerar Chave de Release Oficial
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias miix \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass miixagendador123 \
            -keypass miixagendador123 \
            -dname "CN=Miix Agendador WP, OU=Mobile, O=Miix, L=Sao Paulo, ST=SP, C=BR"

      - name: Compilar APK (Release)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Localizar e Renomear APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk -name "*.apk" -exec cp {} output_apk/MiixAgendadorWP.apk \;
          echo "Verificando APK gerado:"
          ls -lh output_apk/

      - name: Upload do APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: MiixAgendadorWP-APK
          path: output_apk/MiixAgendadorWP.apk
          retention-days: 30

      - name: Criar Release no GitHub (se Tag ou Execução Manual)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Miix Agendador WP v1.0.0"
          tag_name: ${{ github.ref_name }}
          files: output_apk/MiixAgendadorWP.apk
          body: |
            ## 🚀 Miix Agendador WP - v1.0.0 (Modo PRO)
            
            Aplicativo de agendamento automático de mensagens para **WhatsApp** e **WhatsApp Business**.
            
            ### ✨ Recursos:
            - Disparos automáticos no WhatsApp e WhatsApp Business via Serviço de Acessibilidade.
            - Suporte a múltiplos contatos e importação em lote (CSV/Lista).
            - Intervalo de segurança anti-ban configurável.
            - Variáveis dinâmicas na mensagem (`{nome}`, `{telefone}`).
            - Repetição diária, semanal e em dias úteis.
            - 100% gratuito, sem anúncios e sem limites de envio.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
